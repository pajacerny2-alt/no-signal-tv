<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b16"><title>NO SIGNAL ENGINE</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b0b16;color:#f4f2ff;font:15px -apple-system,BlinkMacSystemFont,Arial,sans-serif}header{padding:24px 18px 16px;background:linear-gradient(140deg,#25204d,#0b0b16)}h1{margin:0;font-size:26px;letter-spacing:2px}small,.muted{color:#aaa6c1}.tag{font-size:11px;letter-spacing:2px;color:#a6f4e0}main{max-width:720px;margin:auto;padding:18px 16px 95px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}.stat,.card{background:#19192c;border:1px solid #34334e;border-radius:16px;padding:15px}.stat strong{display:block;font-size:23px;margin-top:7px}.card{margin-bottom:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{font-size:11px;border-radius:30px;background:#383154;padding:6px 9px;color:#d9cbff}button,select,input,textarea{font:inherit}button{background:#8d6bff;color:white;border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}button.secondary{background:#33334e}button.danger{background:#68384d}button:disabled{opacity:.45}textarea,input,select{width:100%;background:#101020;color:white;border:1px solid #494565;border-radius:10px;padding:12px;margin:7px 0}textarea{min-height:110px}nav{position:fixed;bottom:0;left:0;right:0;background:#171728;border-top:1px solid #38334d;display:flex;justify-content:space-around;padding:10px 3px max(14px,env(safe-area-inset-bottom))}nav button{background:transparent;font-size:12px;padding:9px 5px;color:#aaa6c1}nav button.active{color:white;background:#44366e}h2{font-size:20px}p{line-height:1.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#11101d;padding:12px;border-radius:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden{display:none}.notice{background:#30253e;border-radius:12px;padding:12px;color:#e8d9ff;margin:12px 0}</style></head>
<body><header><div class="tag">◉ INTERDIMENSIONAL BROADCAST</div><h1>NO SIGNAL ENGINE</h1><small>Control Center · Local MVP v0.1</small></header><main id="app"></main><nav id="nav"></nav>
<script>
const KEY='no-signal-v01';const CHANNELS=['Breaking News','Galactic Shopping','Forbidden Channels'];const IDEAS=[
['Breaking News','Tuesday Has Been Cancelled','Breaking news: Tuesday has been declared illegal. Citizens caught experiencing Tuesday face six Wednesdays in prison. Tomorrow is also Tuesday.','Photorealistic serious pigeon news anchor in a modern TV studio, cinematic broadcast lighting, surreal deadpan comedy, vertical 9:16, no text.'],
['Galactic Shopping','Pocket Weather','Tired of weather you did not choose? Introducing Pocket Weather. Now with optional indoor hurricanes. Side effects may include geography.','1980s television infomercial salesman holding a glass jar containing a miniature thunderstorm, VHS texture, vertical 9:16, no text.'],
['Forbidden Channels','Wrong Universe','This channel does not exist. Someone has been watching every universe. We know it is you. Do not change the channel.','Dark abandoned broadcast control room filled with flickering CRT screens and cosmic purple static, analog horror, vertical 9:16, no text.']];
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.episodes))state={episodes:[],daily:3};let tab='overview';const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function generate(){const counts=Object.fromEntries(CHANNELS.map(c=>[c,state.episodes.filter(e=>e.channel===c).length]));for(const ch of CHANNELS){const i=CHANNELS.indexOf(ch),base=IDEAS[i],n=counts[ch]+1;state.episodes.unshift({id:uid(),channel:ch,title:n===1?base[1]:base[1]+' — Transmission '+n,script:base[2],prompt:base[3],status:'draft',created:new Date().toISOString(),video:''})}save();tab='production';render()}
function update(id,field,value){let e=state.episodes.find(x=>x.id===id);if(!e)return;e[field]=value;save();render()}
function move(id,status){update(id,'status',status)}
function epCard(e){return '<article class="card"><div class="row"><small>'+esc(e.channel)+'</small><span class="pill">'+esc(e.status.toUpperCase().replaceAll('_',' '))+'</span></div><h3>'+esc(e.title)+'</h3><details><summary>Script & video prompt</summary><label>Script<textarea data-id="'+e.id+'" data-field="script">'+esc(e.script)+'</textarea></label><label>Video prompt<textarea data-id="'+e.id+'" data-field="prompt">'+esc(e.prompt)+'</textarea></label></details><div class="actions">'+(e.status==='draft'?'<button data-action="approve_script" data-id="'+e.id+'">Approve script</button>':'')+(e.status==='script_approved'?'<button data-action="video_review" data-id="'+e.id+'">Send to video review</button>':'')+(e.status==='video_review'?'<button data-action="ready" data-id="'+e.id+'">Approve video</button><button class="danger" data-action="draft" data-id="'+e.id+'">Request changes</button>':'')+(e.status==='ready'?'<button data-action="published" data-id="'+e.id+'">Mark published</button>':'')+'<button class="secondary" data-action="copy" data-id="'+e.id+'">Copy prompt</button></div>'+(e.status==='video_review'?'<label>Video link for review<input data-id="'+e.id+'" data-field="video" placeholder="https://..." value="'+esc(e.video)+'"></label>':'')+'</article>'}
function render(){const tabs=['overview','production','review','broadcast','settings'];document.getElementById('nav').innerHTML=tabs.map(t=>'<button class="'+(t===tab?'active':'')+'" data-tab="'+t+'">'+({overview:'Overview',production:'Production',review:'Review',broadcast:'Broadcast',settings:'Settings'}[t])+'</button>').join('');const all=state.episodes;let s='';
if(tab==='overview'){s='<h2>Broadcast overview</h2><div class="stats"><div class="stat"><small>Episodes</small><strong>'+all.length+'</strong></div><div class="stat"><small>Review</small><strong>'+all.filter(e=>e.status==='video_review').length+'</strong></div><div class="stat"><small>Ready</small><strong>'+all.filter(e=>e.status==='ready').length+'</strong></div></div><div class="notice">Local prototype: no AI API, rendering, or TikTok posting is connected yet. All data stays in this browser.</div><button data-action="generate">Generate 3 episode drafts</button><h2>Recent episodes</h2>'+all.slice(0,3).map(epCard).join('')}
if(tab==='production')s='<h2>Production queue</h2><p class="muted">Three selected channels · '+state.daily+' planned videos per day</p><button data-action="generate">Generate 3 episode drafts</button><div style="height:16px"></div>'+all.map(epCard).join('');
if(tab==='review')s='<h2>Review queue</h2><p class="muted">Approve scripts first. Only approve final video after watching it.</p>'+ (all.filter(e=>['draft','video_review'].includes(e.status)).map(epCard).join('')||'<p>No episodes awaiting review.</p>');
if(tab==='broadcast')s='<h2>Broadcast schedule</h2><div class="notice">Publishing is manual in v0.1. Mark an episode published only after posting it yourself.</div>'+ (all.filter(e=>['ready','published'].includes(e.status)).map(epCard).join('')||'<p>No episodes ready yet.</p>');
if(tab==='settings')s='<h2>Settings</h2><div class="card"><strong>Active channels</strong><p>'+CHANNELS.join(' · ')+'</p><label>Daily production target<input type="number" min="1" max="10" id="daily" value="'+state.daily+'"></label><button data-action="export">Export backup JSON</button> <button class="secondary" data-action="import">Import JSON</button><input class="hidden" id="importfile" type="file" accept="application/json"><p class="muted">Save a backup before clearing browser data. Public GitHub Pages is not private storage.</p></div>';
document.getElementById('app').innerHTML=s}
document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-tab],[data-action]');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();return}const id=b.dataset.id,a=b.dataset.action;if(a==='generate')generate();else if(a==='approve_script')move(id,'script_approved');else if(a==='video_review')move(id,'video_review');else if(a==='ready'){const e=state.episodes.find(x=>x.id===id);if(!e.video){alert('Add a video link before approving.');return}move(id,'ready')}else if(a==='draft')move(id,'draft');else if(a==='published')move(id,'published');else if(a==='copy'){const e=state.episodes.find(x=>x.id===id);try{await navigator.clipboard.writeText(e.prompt);alert('Prompt copied')}catch(err){prompt('Copy prompt:',e.prompt)}}else if(a==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='no-signal-backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}else if(a==='import')document.getElementById('importfile').click()});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset.id&&t.dataset.field)update(t.dataset.id,t.dataset.field,t.value);if(t.id==='daily'){state.daily=Math.max(1,Math.min(10,Number(t.value)||3));save();render()}if(t.id==='importfile'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.episodes))throw Error();state=x;save();render()}catch(e){alert('Invalid backup file')}};r.readAsText(t.files[0])}});render();
</script></body></html>
