<body><header><div class="tag">◈ NO SIGNAL / NETWORK</div><h1>NO SIGNAL ENGINE</h1><small>DIMENSIONAL BROADCAST SYSTEM / v0.5</small></header><main id="app"></main><nav id="nav"></nav>
<script>
const KEY='no-signal-v01';const CHANNELS=['Breaking News','Galactic Shopping','Forbidden Channels'];const IDEAS=[
['Breaking News','Tuesday Has Been Cancelled','Breaking news: Tuesday has been declared illegal. Citizens caught experiencing Tuesday face six Wednesdays in prison. Tomorrow is also Tuesday.','Photorealistic serious pigeon news anchor in a modern TV studio, cinematic broadcast lighting, surreal deadpan comedy, vertical 9:16, no text.'],
['Galactic Shopping','Pocket Weather','Tired of weather you did not choose? Introducing Pocket Weather. Now with optional indoor hurricanes. Side effects may include geography.','1980s television infomercial salesman holding a glass jar containing a miniature thunderstorm, VHS texture, vertical 9:16, no text.'],
['Forbidden Channels','Wrong Universe','This channel does not exist. Someone has been watching every universe. We know it is you. Do not change the channel.','Dark abandoned broadcast control room filled with flickering CRT screens and cosmic purple static, analog horror, vertical 9:16, no text.']];
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.episodes))state={episodes:[],daily:3};let tab='overview';const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function generate(){const counts=Object.fromEntries(CHANNELS.map(c=>[c,state.episodes.filter(e=>e.channel===c).length]));for(const ch of CHANNELS){const i=CHANNELS.indexOf(ch),base=IDEAS[i],n=counts[ch]+1;state.episodes.unshift({id:uid(),channel:ch,title:n===1?base[1]:base[1]+' — Transmission '+n,script:base[2],prompt:base[3],status:'draft',created:new Date().toISOString(),video:''})}save();tab='production';render()}
function update(id,field,value){let e=state.episodes.find(x=>x.id===id);if(!e)return;e[field]=value;save();render()}
function move(id,status){update(id,'status',status)}
function epCard(e){return '<article class="card"><div class="row"><small>'+esc(e.channel)+'</small><span class="pill">'+esc(e.status.toUpperCase().replaceAll('_',' '))+'</span></div><h3>'+esc(e.title)+'</h3><details><summary>Script & video prompt</summary><label>Script<textarea data-id="'+e.id+'" data-field="script">'+esc(e.script)+'</textarea></label><label>Video prompt<textarea data-id="'+e.id+'" data-field="prompt">'+esc(e.prompt)+'</textarea></label></details>'+(e.source==='puter-ai-v2'?'<details><summary>Production bible · AI notes</summary><p><b>Hook:</b> '+esc(e.hook||'')+'</p><p><b>Synopsis:</b> '+esc(e.synopsis||'')+'</p><p><b>Voice:</b> '+esc(e.voice_direction||'')+'</p><p><b>Sound:</b> '+esc(e.sound_design||'')+'</p><p><b>Captions:</b> '+esc((e.captions||[]).join(' / '))+'</p><p><b>Lore:</b> '+esc(e.lore_note||'')+'</p><p><b>Production:</b> '+esc(e.production_notes||'')+'</p><p><b>Timing:</b> '+esc((e.quality_check||{}).words||'?')+' spoken words; target '+esc(e.duration)+'s</p></details>':'')+'<div class="actions">'+(e.status==='draft'?'<button data-action="approve_script" data-id="'+e.id+'">Approve script</button>':'')+(e.status==='script_approved'?'<button data-action="video_review" data-id="'+e.id+'">Send to video review</button>':'')+(e.status==='video_review'?'<button data-action="ready" data-id="'+e.id+'">Approve video</button><button class="danger" data-action="draft" data-id="'+e.id+'">Request changes</button>':'')+(e.status==='ready'?'<button data-action="published" data-id="'+e.id+'">Mark published</button>':'')+'<button class="secondary" data-action="copy" data-id="'+e.id+'">Copy prompt</button></div>'+(e.status==='video_review'?'<label>Video link for review<input data-id="'+e.id+'" data-field="video" placeholder="https://..." value="'+esc(e.video)+'"></label>':'')+'</article>'}
let aiBusy=false;function compactCard(e){return '<article class="episode-row"><div class="row"><span class="micro">'+esc(e.channel)+'</span><span class="pill">'+esc(e.status.replaceAll('_',' '))+'</span></div><h3>'+esc(e.title)+'</h3><small>TRANSMISSION / '+esc(e.id.slice(-5).toUpperCase())+'</small><div class="actions"><button class="secondary" data-action="openepisode" data-id="'+e.id+'">Open episode ↗</button></div></article>'}
function render(){const tabs=['overview','production','review','broadcast','settings'];const icons={overview:'◈',production:'▤',review:'◎',broadcast:'◉',settings:'⚙'};document.getElementById('nav').innerHTML=tabs.map(t=>'<button class="'+(t===tab?'active':'')+'" data-tab="'+t+'"><span style="display:block;font-size:19px;margin-bottom:3px">'+icons[t]+'</span>'+({overview:'Home',production:'Studio',review:'Review',broadcast:'On air',settings:'Config'}[t])+'</button>').join('');const all=state.episodes;let s='';
if(tab==='overview'){s='<section class="signal-screen"><div class="micro">NO SIGNAL / DIMENSION 000</div><h2>Reality is a programming error.</h2><p>Control the broadcasts. Approve the impossible. Keep the signal alive.</p><div class="screen-footer"><span class="pulse"></span> SIGNAL STABLE <span style="color:#78718e">/ 03 CHANNELS</span></div></section><div class="kicker"><h2>LIVE FREQUENCIES</h2><span>03 / ACTIVE</span></div><div class="channel-grid">'+CHANNELS.map((ch,i)=>'<button class="channel-tile" data-action="channel" data-channel="'+esc(ch)+'"><div><span class="micro">CH-00'+(i+1)+' / '+(['NEWS FEED','COMMERCE','RESTRICTED'][i])+'</span><b>'+esc(ch)+'</b><small>'+all.filter(e=>e.channel===ch).length+' transmissions in archive</small></div><span class="arrow">↗</span></button>').join('')+'</div><div class="kicker"><h2>CONTROL METRICS</h2><span>LOCAL SYSTEM</span></div><div class="metrics"><div class="metric"><small>Episodes</small><strong>'+all.length+'</strong></div><div class="metric"><small>In review</small><strong>'+all.filter(e=>['draft','video_review'].includes(e.status)).length+'</strong></div><div class="metric"><small>Ready</small><strong>'+all.filter(e=>e.status==='ready').length+'</strong></div></div><button class="primary-wide" data-action="generate">＋ Generate 3 transmissions</button><div class="kicker"><h2>LATEST SIGNALS</h2><span>ARCHIVE</span></div>'+(all.slice(0,3).map(compactCard).join('')||'<p class="muted">No transmissions yet. Generate your first three drafts.</p>')}
if(tab==='production')s='<div class="view-intro"><div class="micro">STUDIO / PRODUCTION</div><h2>Transmission queue</h2><p>Three frequencies. One production pipeline.</p></div><button class="primary-wide" data-action="generate">＋ Generate 3 transmissions</button><div class="kicker"><h2>ALL EPISODES</h2><span>'+all.length+' TOTAL</span></div>'+ (all.map(epCard).join('')||'<p class="muted">No episodes yet.</p>');
if(tab==='production'){const panel='<section class="ai-panel"><span class="ai-chip">◉ WRITERS ROOM / V0.5</span><h3>Transmission laboratory</h3><p class="muted" style="font-size:12px">Original English scripts with timed beats, universe continuity and production notes. Puter free allowance applies.</p><label>Frequency<select id="ai-channel"><option>Breaking News</option><option>Galactic Shopping</option><option>Forbidden Channels</option></select></label><div class="ai-two"><label>Duration<select id="ai-duration"><option value="15">15 seconds</option><option value="30" selected>30 seconds</option><option value="45">45 seconds</option><option value="60">60 seconds</option></select></label><label>Creative mode<select id="ai-mode"><option value="balanced">Signature NO SIGNAL</option><option value="surreal">Maximum absurdity</option><option value="dark">Uncanny / dark comedy</option><option value="satire">Sharp social satire</option><option value="lore">Deep universe lore</option></select></label></div><label>Seed idea / creative direction<textarea id="ai-idea" style="min-height:76px" maxlength="500" placeholder="Optional — surprise me with something genuinely original"></textarea></label><label>Episode continuity<select id="ai-continuity"><option value="standalone">Standalone (shared universe)</option><option value="callback">Callback to previous episodes</option><option value="arc">Advance the CH-000 mystery</option></select></label><label>Creative constraints (optional)<input id="ai-constraints" maxlength="300" placeholder="e.g. one character, simple set, no dialogue"></label><label class="ai-toggle"><input type="checkbox" id="ai-polish"> Run a second AI editorial pass (uses extra free allowance)</label><button data-action="ai_generate" id="ai-button">✦ CREATE ORIGINAL EPISODE</button><div id="ai-status" class="ai-status" role="status"></div><p class="muted" style="font-size:11px">No automatic payment. Generated work stays in your existing local episode archive.</p></section>';s=s.replace('<button class="primary-wide" data-action="generate">＋ Generate 3 transmissions</button>',panel+'<button class="secondary" data-action="generate" style="width:100%">Offline template fallback</button>')}
if(tab==='review')s='<div class="view-intro"><div class="micro">QUALITY CONTROL / 02</div><h2>Review station</h2><p>Approve the script, then review the final video.</p></div>'+(all.filter(e=>['draft','video_review'].includes(e.status)).map(epCard).join('')||'<p class="muted">Nothing awaiting review.</p>');
if(tab==='broadcast')s='<div class="view-intro"><div class="micro">TRANSMISSION / OUTPUT</div><h2>Broadcast desk</h2><p>Ready-to-publish and published transmissions.</p></div><div class="notice">Publishing is manual. No TikTok integration is active yet.</div>'+(all.filter(e=>['ready','published'].includes(e.status)).map(epCard).join('')||'<p class="muted">No transmissions ready.</p>');
if(tab==='settings')s='<div class="view-intro"><div class="micro">SYSTEM / CONFIGURATION</div><h2>Station settings</h2><p>Local data. No cloud sync or AI connection yet.</p></div><div class="card"><strong>Active frequencies</strong><p>'+CHANNELS.join(' · ')+'</p><label>Daily production target<input type="number" min="1" max="10" id="daily" value="'+state.daily+'"></label><div class="actions"><button data-action="export">Export JSON backup</button><button class="secondary" data-action="import">Import backup</button></div><input class="hidden" id="importfile" type="file" accept="application/json"><p class="muted">Keep a backup before clearing Safari data.</p></div>';
document.getElementById('app').innerHTML=s}


const WRITER_BIBLE={
'Breaking News':{identity:'A completely serious cross-dimensional newsroom covering impossible civic events. Anchors never acknowledge the absurdity.',structure:'URGENT headline -> specific verifiable-sounding details -> government or expert reaction -> escalating unintended consequence -> devastating deadpan sign-off.',visual:'premium realistic newsroom, precise broadcast compositions, restrained urgent graphics described for editing only, cinematic lighting',avoid:'generic aliens, random explosions, repeating the same joke, wacky anchor acting'},
'Galactic Shopping':{identity:'A dangerously convincing late-night intergalactic shopping network. Products solve invented problems and create worse ones.',structure:'immediate product demonstration -> impossible benefit -> surprising live demo -> legal side effect delivered casually -> irresistible deranged sales close.',visual:'retro-futurist infomercial, practical product closeups, bright controlled studio lighting, 1980s analog texture',avoid:'generic magical gadgets, arbitrary lists of features, overly long disclaimers'},
'Forbidden Channels':{identity:'An intercepted television frequency that seems to recognize its viewers. Uncanny, atmospheric, intelligent and slyly funny.',structure:'impossible opening warning -> unsettling concrete detail -> personal implication -> reality contradiction -> unforgettable final line.',visual:'analog transmission artifacts, liminal interiors, eerie CRT glow, carefully controlled cinematic framing',avoid:'cheap jump scares, gore, clichéd static-only shots, empty cryptic statements'}
};
const LORE='NO SIGNAL TV is a fictional multiverse broadcaster. CH-000 is an elusive source channel that sometimes bleeds into the three official frequencies. Recurring motifs: missing minutes, reality maintenance department, impossible consumer rights, corrupted station IDs, audience members who do not exist. Recurring motifs are optional, never forced. Preserve a coherent universe while keeping each episode understandable to a new viewer.';
function aiText(response){let x=response?.message?.content??response?.text??response;if(Array.isArray(x))x=x.map(p=>p.text||p.content||'').join('');return typeof x==='string'?x:JSON.stringify(x)}
function aiParse(response){let raw=aiText(response).trim().replace(/^\x60{3}(?:json)?\s*/i,'').replace(/\s*\x60{3}$/,'');let obj;try{obj=JSON.parse(raw)}catch(e){const i=raw.indexOf('{'),j=raw.lastIndexOf('}');if(i<0||j<=i)throw Error('AI returned invalid JSON. Retry the generation.');obj=JSON.parse(raw.slice(i,j+1))}if(!obj||!obj.title||!obj.script||!obj.prompt)throw Error('AI response is missing required fields.');return obj}
function aiValidate(o,duration){const script=String(o.script||'');const spoken=script.replace(/\[[^\]]*\]/g,'').replace(/\([^)]*\)/g,'').replace(/\b(?:ANCHOR|HOST|NARRATOR|VOICE|CUSTOMER|EXPERT):/gi,'');const words=spoken.trim().split(/\s+/).filter(Boolean).length;const target=Math.round(duration*2.25);return {words,target,estimate:Math.round(words/2.25),notes:[...(words>target*1.3?['Spoken dialogue may run long; trim for timing.']:[]),...(words<target*.55?['Dialogue may be short for the selected duration.']:[]),...(String(o.title).length>70?['Title is long; consider shortening it.']:[])]}}
function aiWriterPrompt({ch,duration,idea,mode,continuity,constraints,recent}){
const guide=WRITER_BIBLE[ch],tone={balanced:'Clever, confident, understated absurdism with a precise punchline.',surreal:'Daring, bizarre, visually specific surrealism that still follows clear internal logic.',dark:'Subtle existential dread with intelligent dark comedy; no gore.',satire:'Biting but nonpartisan satire of bureaucracy, consumerism, corporate logic and technology.',lore:'Mystery-rich interdimensional storytelling with a clear stand-alone payoff.'}[mode];
return ['ROLE: You are a senior comedy showrunner, script editor and short-form video director writing for NO SIGNAL TV. Create a SINGLE excellent ORIGINAL English episode, not an outline.','SERIES BIBLE: '+LORE,'CHANNEL: '+ch+'. IDENTITY: '+guide.identity,'STORY ENGINE: '+guide.structure,'VISUAL LANGUAGE: '+guide.visual,'AVOID: '+guide.avoid,'TONE: '+tone,'TARGET DURATION: '+duration+' seconds. Spoken dialogue target '+Math.round(duration*2.25)+' words (allow natural pauses); 2-second hook, strong escalation, specific surprising payoff. Every joke should have a setup and earned twist. No filler.','USER SEED: '+idea,'ADDITIONAL PRODUCTION CONSTRAINTS: '+(constraints||'Practical, simple to generate, max 2 speaking characters, coherent recurring visual identity.'),'CONTINUITY MODE: '+continuity+'. '+(continuity==='arc'?'Advance the CH-000 mystery by ONE intriguing clue, but do not reveal the full mystery.':continuity==='callback'?'Include a subtle meaningful callback to one earlier event without reusing its central joke.':'Standalone story; any lore should be subtle.'),'PREVIOUS EPISODES (do not duplicate premises, headlines, punchlines or titles): '+(recent||'None yet.'),'QUALITY REQUIREMENTS: Think through multiple possible premises internally and select the strongest. Clear physical situation, memorable original detail, high-concept hook in first sentence, escalating beats, punchline that recontextualizes the premise. Show rather than explain. Avoid recognizable copyrighted characters, trademarked fictional brands, and real-world defamation.','PRODUCTION: A short 9:16 vertical episode. Write a timed script with timestamps like [00:00-00:03] and speaker labels; no more than 5 distinct visual shots. Write a separate detailed video-generation prompt with shot-by-shot composition, character continuity, camera, motion, atmosphere and lighting. No burned-in captions or text in generated visuals (captions added in edit). Include an optional concise voice direction, sound cues, on-screen caption suggestions, and a one-line episode synopsis.','OUTPUT STRICT JSON OBJECT, no markdown, with these keys: title (string), hook (string), synopsis (string), script (string), prompt (string), voice_direction (string), sound_design (string), captions (array of 2-5 short strings), lore_note (string), production_notes (string). All content English.'];
}
function statusAI(message){const el=document.getElementById('ai-status');if(el)el.textContent=message}
async function generateAI(){
if(aiBusy)return;
const ch=document.getElementById('ai-channel')?.value||CHANNELS[0],duration=Number(document.getElementById('ai-duration')?.value||30),idea=document.getElementById('ai-idea')?.value.trim()||'Invent an unexpected and original premise',mode=document.getElementById('ai-mode')?.value||'balanced',continuity=document.getElementById('ai-continuity')?.value||'standalone',constraints=document.getElementById('ai-constraints')?.value.trim()||'',polish=!!document.getElementById('ai-polish')?.checked;
if(!window.puter?.ai?.chat){statusAI('AI library unavailable. Check your connection and open in Safari.');return}
aiBusy=true;const btn=document.getElementById('ai-button');if(btn){btn.disabled=true;btn.textContent='✦ WRITING…'}
const recent=state.episodes.slice(0,35).map(e=>e.channel+': '+e.title+(e.synopsis?' — '+e.synopsis:'')).join(' | ').slice(0,4500);
const cfg={ch,duration,idea,mode,continuity,constraints,recent};
try{
statusAI('Developing premise and writing timed scenes…');
const response=await puter.ai.chat(aiWriterPrompt(cfg).join('\n\n'),{normalize:true,max_tokens:2300,temperature:.85});
let obj=aiParse(response),polished=false;
if(polish){
statusAI('Editorial pass: checking originality, timing, clarity and punchline…');
try{const editPrompt='You are the rigorous executive script editor of NO SIGNAL TV. Rewrite the following JSON episode to improve its hook, internal logic, joke escalation, originality, final payoff, spoken pacing and visual production feasibility. Keep channel '+ch+' and target '+duration+' seconds. Preserve all JSON keys, and return ONLY the improved complete JSON object. Do not add explanations. Existing recent episodes: '+recent+'\n\nDRAFT JSON:\n'+JSON.stringify(obj);const revision=aiParse(await puter.ai.chat(editPrompt,{normalize:true,max_tokens:2300,temperature:.65}));obj=revision;polished=true}catch(e){statusAI('Editorial pass unavailable; preserving the first complete draft.')}
}
const qa=aiValidate(obj,duration);
state.episodes.unshift({id:uid(),channel:ch,title:String(obj.title).slice(0,120),script:String(obj.script),prompt:String(obj.prompt),status:'draft',created:new Date().toISOString(),video:'',source:'puter-ai-v2',duration,mode,continuity,hook:String(obj.hook||''),synopsis:String(obj.synopsis||''),voice_direction:String(obj.voice_direction||''),sound_design:String(obj.sound_design||''),captions:Array.isArray(obj.captions)?obj.captions:[],lore_note:String(obj.lore_note||''),production_notes:String(obj.production_notes||''),editorial_pass:polished,quality_check:qa});
save();render();statusAI('✓ Saved as DRAFT · '+qa.words+' spoken words / ~'+qa.estimate+'s. '+(qa.notes.join(' ')||'Timing looks reasonable.')+(polished?' · Editorial pass complete.':''));window.scrollTo({top:0,behavior:'smooth'});
}catch(e){statusAI('Generation failed: '+(e?.message||'Puter sign-in, allowance or network issue. Please retry.'))}
finally{aiBusy=false;const b=document.getElementById('ai-button');if(b){b.disabled=false;b.textContent='✦ CREATE ORIGINAL EPISODE'}}
}

document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-tab],[data-action]');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();return}const id=b.dataset.id,a=b.dataset.action;if(a==='ai_generate'){await generateAI();return}else if(a==='channel'){tab='production';render();return}else if(a==='openepisode'){tab='production';render();const el=document.querySelector('[data-id="'+id+'"]');if(el)el.closest('.card')?.scrollIntoView({behavior:'smooth',block:'center'});return}else if(a==='generate')generate();else if(a==='approve_script')move(id,'script_approved');else if(a==='video_review')move(id,'video_review');else if(a==='ready'){const e=state.episodes.find(x=>x.id===id);if(!e.video){alert('Add a video link before approving.');return}move(id,'ready')}else if(a==='draft')move(id,'draft');else if(a==='published')move(id,'published');else if(a==='copy'){const e=state.episodes.find(x=>x.id===id);try{await navigator.clipboard.writeText(e.prompt);alert('Prompt copied')}catch(err){prompt('Copy prompt:',e.prompt)}}else if(a==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='no-signal-backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}else if(a==='import')document.getElementById('importfile').click()});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset.id&&t.dataset.field)update(t.dataset.id,t.dataset.field,t.value);if(t.id==='daily'){state.daily=Math.max(1,Math.min(10,Number(t.value)||3));save();render()}if(t.id==='importfile'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.episodes))throw Error();state=x;save();render()}catch(e){alert('Invalid backup file')}};r.readAsText(t.files[0])}});render();
</script></body></html>
